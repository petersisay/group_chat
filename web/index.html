<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Group Chat Studio - Live Web Video & Voice</title>
    <style>
        :root {
            --bg-base: #0b0e14;
            --bg-surface: #141923;
            --bg-elevated: #1b2230;
            --bg-hover: #263044;
            --border-subtle: #242c3d;
            --border-active: #3b4760;
            --text-main: #f0f4fc;
            --text-muted: #8c9bb5;
            --accent-blue: #3b82f6;
            --accent-blue-hover: #2563eb;
            --accent-green: #10b981;
            --accent-green-hover: #059669;
            --accent-red: #ef4444;
            --accent-red-hover: #dc2626;
            --accent-purple: #8b5cf6;
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Header */
        header {
            background-color: var(--bg-surface);
            padding: 10px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-subtle);
            z-index: 20;
            flex-shrink: 0;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-logo {
            font-size: 19px;
            font-weight: 800;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .room-pill {
            background: rgba(59, 130, 246, 0.12);
            color: #93c5fd;
            border: 1px solid rgba(59, 130, 246, 0.25);
            padding: 3px 9px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 600;
            color: var(--accent-green);
            background: rgba(16, 185, 129, 0.1);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .status-dot {
            width: 7px;
            height: 7px;
            background: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-green);
        }

        .user-tag {
            font-size: 13px;
            font-weight: 600;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-logout {
            background: rgba(239, 68, 68, 0.12);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 6px 14px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.15s ease;
        }

        .btn-logout:hover {
            background: var(--accent-red);
            color: #fff;
            border-color: var(--accent-red);
        }

        /* Mobile View Switcher */
        .mobile-view-tabs {
            display: none;
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border-subtle);
        }

        .mobile-tab-btn {
            flex: 1;
            padding: 10px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 2px solid transparent;
        }

        .mobile-tab-btn.active {
            color: var(--accent-blue);
            border-bottom-color: var(--accent-blue);
            background: rgba(59, 130, 246, 0.08);
        }

        /* Main Body Workspace */
        .workspace {
            flex: 1;
            display: flex;
            overflow: hidden;
            position: relative;
        }

        /* Video Stage */
        .video-stage {
            flex: 1;
            background: var(--bg-base);
            padding: 14px;
            display: flex;
            flex-direction: column;
            overflow: auto;
            position: relative;
        }

        /* Smart Adaptive Video Grid */
        .video-grid {
            flex: 1;
            display: grid;
            gap: 14px;
            width: 100%;
            height: 100%;
            align-content: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        /* Responsive Grid Arrangements */
        .video-grid[data-count="1"] {
            grid-template-columns: minmax(auto, 880px);
            grid-template-rows: 1fr;
        }

        .video-grid[data-count="2"] {
            grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
        }

        .video-grid[data-count="3"],
        .video-grid[data-count="4"] {
            grid-template-columns: repeat(2, minmax(320px, 1fr));
        }

        .video-grid[data-count="5"],
        .video-grid[data-count="6"] {
            grid-template-columns: repeat(3, minmax(280px, 1fr));
        }

        .video-grid[data-count="more"] {
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        }

        /* Video Tile */
        .video-tile {
            background: var(--bg-surface);
            border: 2px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            position: relative;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
            transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s;
        }

        .video-tile:hover {
            border-color: var(--border-active);
        }

        .video-tile.speaking {
            border-color: var(--accent-green);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.45);
        }

        .video-tile img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: calc(var(--radius-lg) - 2px);
        }

        /* Avatar Placeholder */
        .avatar-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #1b2333 0%, #10151f 100%);
        }

        .avatar-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            font-weight: 800;
            color: #fff;
            border: 3px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
        }

        /* Tile Overlay Controls */
        .tile-overlay-bottom {
            position: absolute;
            bottom: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            pointer-events: none;
        }

        .tile-name-tag {
            background: rgba(11, 14, 20, 0.85);
            backdrop-filter: blur(6px);
            padding: 4px 10px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 600;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            pointer-events: auto;
        }

        .mic-icon-indicator {
            font-size: 12px;
        }

        .tile-badges {
            display: flex;
            gap: 6px;
            pointer-events: auto;
        }

        .mode-badge {
            font-size: 10px;
            font-weight: 700;
            padding: 3px 7px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .badge-live {
            background: #ef4444;
            color: #fff;
        }

        .badge-screen {
            background: #8b5cf6;
            color: #fff;
        }

        /* Sidebar: Chat & Online Members */
        .sidebar {
            width: 350px;
            background: var(--bg-surface);
            border-left: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            z-index: 10;
        }

        .sidebar-tabs {
            display: flex;
            border-bottom: 1px solid var(--border-subtle);
            background: var(--bg-surface);
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.15s ease;
        }

        .tab-btn.active {
            color: var(--accent-blue);
            border-bottom-color: var(--accent-blue);
            background: rgba(59, 130, 246, 0.06);
        }

        .tab-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Chat History */
        .chat-messages {
            flex: 1;
            padding: 14px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .chat-msg {
            display: flex;
            flex-direction: column;
            gap: 3px;
            font-size: 13px;
            line-height: 1.45;
        }

        .chat-msg.system {
            color: #94a3b8;
            font-size: 11.5px;
            font-style: italic;
            align-self: center;
            background: rgba(255, 255, 255, 0.04);
            padding: 4px 12px;
            border-radius: 12px;
        }

        .msg-meta {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        .msg-sender {
            font-weight: 700;
            color: #60a5fa;
        }

        .msg-sender.self {
            color: #34d399;
        }

        .msg-timestamp {
            font-size: 11px;
            color: #64748b;
        }

        .msg-text {
            color: #e2e8f0;
            word-break: break-word;
            padding-left: 2px;
        }

        /* Chat Input Bar */
        .chat-input-bar {
            padding: 12px 14px;
            border-top: 1px solid var(--border-subtle);
            display: flex;
            gap: 8px;
            background: var(--bg-surface);
        }

        .chat-input {
            flex: 1;
            background: var(--bg-elevated);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-sm);
            padding: 9px 12px;
            color: #fff;
            font-size: 13.5px;
            outline: none;
            transition: border-color 0.15s;
        }

        .chat-input:focus {
            border-color: var(--accent-blue);
        }

        .btn-send {
            background: var(--accent-blue);
            color: white;
            border: none;
            padding: 0 16px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
        }

        .btn-send:hover {
            background: var(--accent-blue-hover);
        }

        /* Online Users List */
        .user-list {
            padding: 14px;
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
        }

        .user-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            background: var(--bg-elevated);
            font-size: 13px;
        }

        .user-initials {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
        }

        /* Bottom Control Dock */
        .media-dock {
            background: var(--bg-surface);
            border-top: 1px solid var(--border-subtle);
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 20;
            flex-shrink: 0;
            gap: 16px;
        }

        .dock-left {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            color: var(--text-muted);
            min-width: 170px;
        }

        .vu-meter-track {
            width: 100px;
            height: 8px;
            background: var(--bg-elevated);
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid var(--border-subtle);
        }

        .vu-meter-bar {
            height: 100%;
            width: 0%;
            background: var(--accent-green);
            transition: width 0.08s linear;
        }

        .dock-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .ctrl-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 9px 16px;
            border-radius: var(--radius-sm);
            border: none;
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
            user-select: none;
            min-height: 40px;
        }

        .ctrl-btn:active {
            transform: scale(0.97);
        }

        .btn-status-on { background: var(--accent-green); }
        .btn-status-on:hover { background: var(--accent-green-hover); }

        .btn-status-off { background: var(--accent-red); }
        .btn-status-off:hover { background: var(--accent-red-hover); }

        .btn-blue { background: var(--accent-blue); }
        .btn-blue:hover { background: var(--accent-blue-hover); }

        .btn-purple { background: var(--accent-purple); }
        .btn-purple:hover { background: #7c3aed; }

        .btn-secondary { background: #374151; color: #d1d5db; }
        .btn-secondary:hover { background: #4b5563; color: #fff; }

        .dock-right {
            font-size: 12px;
            color: var(--text-muted);
            min-width: 170px;
            text-align: right;
        }

        /* Welcome / Join Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(11, 14, 20, 0.88);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 16px;
        }

        .modal-box {
            background: var(--bg-surface);
            border: 1px solid var(--border-active);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 400px;
            padding: 32px 28px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6);
        }

        .modal-title {
            font-size: 22px;
            font-weight: 800;
            text-align: center;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .modal-desc {
            font-size: 13.5px;
            color: var(--text-muted);
            text-align: center;
            line-height: 1.5;
        }

        .modal-input {
            background: var(--bg-elevated);
            border: 1px solid var(--border-active);
            padding: 12px 14px;
            border-radius: var(--radius-sm);
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.15s;
        }

        .modal-input:focus {
            border-color: var(--accent-blue);
        }

        .modal-btn {
            background: var(--accent-blue);
            color: white;
            border: none;
            padding: 12px;
            border-radius: var(--radius-sm);
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.15s;
        }

        .modal-btn:hover {
            background: var(--accent-blue-hover);
        }

        /* Responsive Breakpoints */
        @media (max-width: 860px) {
            .mobile-view-tabs {
                display: flex;
            }

            .sidebar {
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                width: 100%;
                z-index: 15;
                display: none;
            }

            .sidebar.mobile-open {
                display: flex;
            }

            .dock-left, .dock-right {
                display: none;
            }

            .media-dock {
                justify-content: center;
                padding: 10px;
            }

            .ctrl-btn {
                padding: 8px 12px;
                font-size: 12px;
            }

            .video-grid[data-count="1"],
            .video-grid[data-count="2"],
            .video-grid[data-count="3"],
            .video-grid[data-count="4"],
            .video-grid[data-count="more"] {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- Join / Welcome Modal -->
    <div id="joinModal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-title">Group Chat Studio</div>
            <div class="modal-desc">Multi-participant video streaming, real-time voice with live VU meter, and synchronized text chat.</div>
            <input type="text" id="usernameField" class="modal-input" placeholder="Choose a display name..." maxlength="24" autofocus>
            <button id="enterRoomBtn" class="modal-btn">Join Chat Room</button>
        </div>
    </div>

    <!-- Header -->
    <header>
        <div class="header-brand">
            <span class="brand-logo">Group Chat</span>
            <span class="room-pill">General Studio</span>
        </div>
        <div class="header-right">
            <div class="status-pill">
                <span class="status-dot"></span>
                <span id="connLabel">Connected</span>
            </div>
            <span id="userBadge" class="user-tag"></span>
            <button id="btnLogout" class="btn-logout" title="Leave the chat room">🚪 Log Out</button>
        </div>
    </header>

    <!-- Mobile Navigation Switcher (Video vs Chat) -->
    <div class="mobile-view-tabs">
        <button id="mobileVideoBtn" class="mobile-tab-btn active">📹 Video Stage</button>
        <button id="mobileChatBtn" class="mobile-tab-btn">💬 Chat & Members (<span id="mobileBadgeCount">0</span>)</button>
    </div>

    <!-- Main Workspace -->
    <div class="workspace">
        <!-- Video Stage -->
        <div id="videoStage" class="video-stage">
            <div id="videoGrid" class="video-grid" data-count="1">
                <!-- Video tiles dynamically rendered here -->
            </div>
        </div>

        <!-- Sidebar (Chat & Members) -->
        <div id="sidebar" class="sidebar">
            <div class="sidebar-tabs">
                <button id="tabChat" class="tab-btn active">Messages</button>
                <button id="tabUsers" class="tab-btn">Members (<span id="userCount">0</span>)</button>
            </div>

            <!-- Chat Content -->
            <div id="chatView" class="tab-content">
                <div id="chatMessages" class="chat-messages">
                    <div class="chat-msg system">Welcome to Group Chat Studio. All services ready.</div>
                </div>
                <div class="chat-input-bar">
                    <input type="text" id="chatInput" class="chat-input" placeholder="Type a message..." autocomplete="off">
                    <button id="sendBtn" class="btn-send">Send</button>
                </div>
            </div>

            <!-- Users Content -->
            <div id="usersView" class="tab-content" style="display: none;">
                <ul id="userList" class="user-list">
                    <!-- User list items rendered here -->
                </ul>
            </div>
        </div>
    </div>

    <!-- Bottom Controls Dock -->
    <div class="media-dock">
        <div class="dock-left">
            <span>Voice Input:</span>
            <div class="vu-meter-track">
                <div id="vuBar" class="vu-meter-bar"></div>
            </div>
        </div>

        <div class="dock-controls">
            <button id="btnMic" class="ctrl-btn btn-status-on">🎤 Mic: On</button>
            <button id="btnDeafen" class="ctrl-btn btn-blue">🔊 Audio: On</button>
            <button id="btnCamera" class="ctrl-btn btn-secondary">📹 Camera: Off</button>
            <button id="btnScreen" class="ctrl-btn btn-secondary">🖥️ Screen: Off</button>
        </div>

        <div class="dock-right">
            <span>Server: Online (WebSocket)</span>
        </div>
    </div>

    <!-- Internal Offscreen Video & Canvas for Capture -->
    <video id="captureVideo" autoplay playsinline muted style="display: none;"></video>
    <canvas id="captureCanvas" width="480" height="360" style="display: none;"></canvas>

    <script>
        // State variables
        let ws = null;
        let myUsername = "";
        let isMicMuted = false;
        let isDeafened = false;
        let isCameraOn = false;
        let isScreenOn = false;

        let localAudioStream = null;
        let audioContext = null;
        let analyser = null;
        let vuInterval = null;
        let videoBroadcastInterval = null;
        let avatarAngle = 0;

        // Map storing participant feeds: username -> { tileEl, imgEl, avatarEl, micIconEl, badgeEl, speakingTimer }
        const peers = new Map();
        const peerMuteStates = new Map();

        // DOM elements
        const joinModal = document.getElementById('joinModal');
        const usernameField = document.getElementById('usernameField');
        const enterRoomBtn = document.getElementById('enterRoomBtn');
        const connLabel = document.getElementById('connLabel');
        const userBadge = document.getElementById('userBadge');
        const btnLogout = document.getElementById('btnLogout');

        const videoGrid = document.getElementById('videoGrid');
        const sidebar = document.getElementById('sidebar');
        const tabChat = document.getElementById('tabChat');
        const tabUsers = document.getElementById('tabUsers');
        const chatView = document.getElementById('chatView');
        const usersView = document.getElementById('usersView');
        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const userList = document.getElementById('userList');
        const userCount = document.getElementById('userCount');
        const mobileBadgeCount = document.getElementById('mobileBadgeCount');

        const mobileVideoBtn = document.getElementById('mobileVideoBtn');
        const mobileChatBtn = document.getElementById('mobileChatBtn');

        const vuBar = document.getElementById('vuBar');
        const btnMic = document.getElementById('btnMic');
        const btnDeafen = document.getElementById('btnDeafen');
        const btnCamera = document.getElementById('btnCamera');
        const btnScreen = document.getElementById('btnScreen');

        const captureVideo = document.getElementById('captureVideo');
        const captureCanvas = document.getElementById('captureCanvas');
        const ctx = captureCanvas.getContext('2d');

        // Mobile View Toggles
        mobileVideoBtn.addEventListener('click', () => {
            mobileVideoBtn.classList.add('active');
            mobileChatBtn.classList.remove('active');
            sidebar.classList.remove('mobile-open');
        });

        mobileChatBtn.addEventListener('click', () => {
            mobileChatBtn.classList.add('active');
            mobileVideoBtn.classList.remove('active');
            sidebar.classList.add('mobile-open');
        });

        // Sidebar Tabs
        tabChat.addEventListener('click', () => {
            tabChat.classList.add('active');
            tabUsers.classList.remove('active');
            chatView.style.display = 'flex';
            usersView.style.display = 'none';
        });

        tabUsers.addEventListener('click', () => {
            tabUsers.classList.add('active');
            tabChat.classList.remove('active');
            chatView.style.display = 'none';
            usersView.style.display = 'flex';
        });

        // 1. Join Room Handler
        function handleJoin() {
            const raw = usernameField.value.trim();
            myUsername = raw ? raw : "User" + Math.floor(Math.random() * 1000);
            joinModal.style.display = 'none';
            userBadge.textContent = myUsername;

            connectWebSocket();
            initMicrophone();
            createOrUpdateTile(myUsername, null, "avatar", true);
            updateGridDimensions();
        }

        enterRoomBtn.addEventListener('click', handleJoin);
        usernameField.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') handleJoin();
        });

        // 2. Log Out Handler
        function handleLogout() {
            // Stop media streams
            stopMediaStream();
            if (localAudioStream) {
                localAudioStream.getTracks().forEach(t => t.stop());
                localAudioStream = null;
            }
            if (audioContext) {
                try { audioContext.close(); } catch (e) {}
                audioContext = null;
            }
            clearInterval(vuInterval);
            clearInterval(videoBroadcastInterval);

            // Close WebSocket
            if (ws) {
                try { ws.close(); } catch (e) {}
                ws = null;
            }

            // Reset states and clear tiles
            peers.clear();
            peerMuteStates.clear();
            videoGrid.innerHTML = '';
            userList.innerHTML = '';
            chatMessages.innerHTML = '<div class="chat-msg system">Logged out. Join anytime.</div>';

            isMicMuted = false;
            isDeafened = false;
            isCameraOn = false;
            isScreenOn = false;

            btnMic.className = "ctrl-btn btn-status-on";
            btnMic.textContent = "🎤 Mic: On";
            btnDeafen.className = "ctrl-btn btn-blue";
            btnDeafen.textContent = "🔊 Audio: On";
            btnCamera.className = "ctrl-btn btn-secondary";
            btnCamera.textContent = "📹 Camera: Off";
            btnScreen.className = "ctrl-btn btn-secondary";
            btnScreen.textContent = "🖥️ Screen: Off";
            vuBar.style.width = '0%';

            // Show join modal again
            joinModal.style.display = 'flex';
            usernameField.value = '';
            usernameField.focus();
        }

        btnLogout.addEventListener('click', handleLogout);

        // 3. WebSocket Manager
        function connectWebSocket() {
            const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${proto}//${window.location.host}/ws`;

            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                connLabel.textContent = "Connected";
                connLabel.style.color = "var(--accent-green)";
                ws.send(JSON.stringify({
                    type: "join",
                    username: myUsername
                }));
            };

            ws.onclose = () => {
                connLabel.textContent = "Offline";
                connLabel.style.color = "var(--accent-red)";
            };

            ws.onerror = (err) => {
                console.error("WebSocket error:", err);
            };

            ws.onmessage = (event) => {
                try {
                    const msg = JSON.parse(event.data);
                    handleSocketMessage(msg);
                } catch (e) {
                    console.error("Failed to parse incoming frame", e);
                }
            };
        }

        function handleSocketMessage(msg) {
            switch (msg.type) {
                case "chat":
                    renderChatMessage(msg.username, msg.text, msg.time);
                    break;
                case "system":
                    renderSystemMessage(msg.text);
                    break;
                case "users":
                    renderOnlineUsers(msg.users);
                    break;
                case "video_frame":
                    if (msg.username !== myUsername) {
                        createOrUpdateTile(msg.username, msg.image, msg.mode, false);
                    }
                    break;
                case "stop_video":
                    if (msg.username !== myUsername) {
                        createOrUpdateTile(msg.username, null, "avatar", false);
                    }
                    break;
                case "voice_level":
                    if (msg.username !== myUsername && !isDeafened) {
                        highlightSpeaking(msg.username, msg.level);
                    }
                    break;
                case "mute_status":
                    peerMuteStates.set(msg.username, msg.isMuted);
                    updateTileMuteIcon(msg.username, msg.isMuted);
                    break;
            }
        }

        // 4. Chat System
        function sendChatMessage() {
            const text = chatInput.value.trim();
            if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;

            ws.send(JSON.stringify({
                type: "chat",
                username: myUsername,
                text: text
            }));
            chatInput.value = "";
        }

        sendBtn.addEventListener('click', sendChatMessage);
        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendChatMessage();
        });

        function renderChatMessage(author, text, time) {
            const isSelf = author === myUsername;
            const timeStr = time ? time : new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            const row = document.createElement('div');
            row.className = 'chat-msg';
            row.innerHTML = `
                <div class="msg-meta">
                    <span class="msg-sender ${isSelf ? 'self' : ''}">${escapeHtml(author)}</span>
                    <span class="msg-timestamp">${timeStr}</span>
                </div>
                <div class="msg-text">${escapeHtml(text)}</div>
            `;
            chatMessages.appendChild(row);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function renderSystemMessage(text) {
            const div = document.createElement('div');
            div.className = 'chat-msg system';
            div.textContent = text;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function renderOnlineUsers(users) {
            userCount.textContent = users.length;
            mobileBadgeCount.textContent = users.length;
            userList.innerHTML = '';

            users.forEach(u => {
                const li = document.createElement('li');
                li.className = 'user-row';
                const initial = u.substring(0, 2).toUpperCase();
                li.innerHTML = `
                    <div class="user-initials">${initial}</div>
                    <span>${escapeHtml(u)} ${u === myUsername ? '(You)' : ''}</span>
                `;
                userList.appendChild(li);

                if (!peers.has(u)) {
                    createOrUpdateTile(u, null, "avatar", u === myUsername);
                }
            });

            // Remove disconnected peers
            peers.forEach((val, name) => {
                if (!users.includes(name) && name !== myUsername) {
                    val.tileEl.remove();
                    peers.delete(name);
                }
            });

            updateGridDimensions();
        }

        // 5. Video Grid Tile Management & Adaptive Arrangement
        function createOrUpdateTile(username, frameData, mode, isSelf) {
            let peer = peers.get(username);

            if (!peer) {
                const tile = document.createElement('div');
                tile.className = 'video-tile';
                tile.id = 'tile_' + username;

                const overlay = document.createElement('div');
                overlay.className = 'tile-overlay-bottom';

                const nameTag = document.createElement('div');
                nameTag.className = 'tile-name-tag';

                const isMuted = peerMuteStates.get(username) || false;
                nameTag.innerHTML = `
                    <span class="mic-icon-indicator">${isMuted ? '🔇' : '🎤'}</span>
                    <span>${escapeHtml(username)} ${isSelf ? '(You)' : ''}</span>
                `;

                const badges = document.createElement('div');
                badges.className = 'tile-badges';

                overlay.appendChild(nameTag);
                overlay.appendChild(badges);
                tile.appendChild(overlay);

                videoGrid.appendChild(tile);

                peer = {
                    tileEl: tile,
                    nameTagEl: nameTag,
                    badgesEl: badges,
                    imgEl: null,
                    avatarEl: null,
                    badgeEl: null
                };
                peers.set(username, peer);
                updateGridDimensions();
            }

            if (frameData) {
                if (!peer.imgEl) {
                    if (peer.avatarEl) peer.avatarEl.remove();
                    peer.imgEl = document.createElement('img');
                    peer.tileEl.insertBefore(peer.imgEl, peer.tileEl.firstChild);
                }
                peer.imgEl.src = frameData;

                if (!peer.badgeEl) {
                    peer.badgeEl = document.createElement('span');
                    peer.badgesEl.appendChild(peer.badgeEl);
                }
                peer.badgeEl.className = mode === 'screen' ? 'mode-badge badge-screen' : 'mode-badge badge-live';
                peer.badgeEl.textContent = mode === 'screen' ? 'Screen' : 'Live';

            } else {
                if (peer.imgEl) {
                    peer.imgEl.remove();
                    peer.imgEl = null;
                }
                if (peer.badgeEl) {
                    peer.badgeEl.remove();
                    peer.badgeEl = null;
                }

                if (!peer.avatarEl) {
                    peer.avatarEl = document.createElement('div');
                    peer.avatarEl.className = 'avatar-placeholder';
                    const initials = username.substring(0, 2).toUpperCase();
                    peer.avatarEl.innerHTML = `<div class="avatar-circle">${initials}</div>`;
                    peer.tileEl.insertBefore(peer.avatarEl, peer.tileEl.firstChild);
                }
            }
        }

        function updateTileMuteIcon(username, isMuted) {
            const peer = peers.get(username);
            if (peer) {
                const mic = peer.nameTagEl.querySelector('.mic-icon-indicator');
                if (mic) mic.textContent = isMuted ? '🔇' : '🎤';
            }
        }

        function updateGridDimensions() {
            const count = peers.size;
            if (count <= 1) {
                videoGrid.setAttribute('data-count', '1');
            } else if (count === 2) {
                videoGrid.setAttribute('data-count', '2');
            } else if (count <= 4) {
                videoGrid.setAttribute('data-count', '4');
            } else if (count <= 6) {
                videoGrid.setAttribute('data-count', '6');
            } else {
                videoGrid.setAttribute('data-count', 'more');
            }
        }

        function highlightSpeaking(username, level) {
            const peer = peers.get(username);
            if (!peer) return;

            if (level > 0.05) {
                peer.tileEl.classList.add('speaking');
                clearTimeout(peer.speakingTimer);
                peer.speakingTimer = setTimeout(() => {
                    peer.tileEl.classList.remove('speaking');
                }, 350);
            }
        }

        // 6. Audio / Microphone Engine
        async function initMicrophone() {
            try {
                localAudioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const source = audioContext.createMediaStreamSource(localAudioStream);
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                source.connect(analyser);

                const dataArray = new Uint8Array(analyser.frequencyBinCount);

                vuInterval = setInterval(() => {
                    if (isMicMuted) {
                        vuBar.style.width = '0%';
                        return;
                    }

                    analyser.getByteFrequencyData(dataArray);
                    let sum = 0;
                    for (let i = 0; i < dataArray.length; i++) {
                        sum += dataArray[i];
                    }
                    const avg = sum / dataArray.length;
                    const level = Math.min(1.0, avg / 120);

                    vuBar.style.width = (level * 100) + '%';

                    if (level > 0.04) {
                        highlightSpeaking(myUsername, level);
                        if (ws && ws.readyState === WebSocket.OPEN) {
                            ws.send(JSON.stringify({
                                type: "voice_level",
                                username: myUsername,
                                level: level
                            }));
                        }
                    }
                }, 100);

            } catch (err) {
                console.log("Physical microphone not accessible, simulated audio levels active.");
            }
        }

        btnMic.addEventListener('click', () => {
            isMicMuted = !isMicMuted;
            if (localAudioStream) {
                localAudioStream.getAudioTracks().forEach(t => t.enabled = !isMicMuted);
            }

            if (isMicMuted) {
                btnMic.textContent = "🔇 Mic: Muted";
                btnMic.className = "ctrl-btn btn-status-off";
                vuBar.style.width = "0%";
            } else {
                btnMic.textContent = "🎤 Mic: On";
                btnMic.className = "ctrl-btn btn-status-on";
            }

            updateTileMuteIcon(myUsername, isMicMuted);
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: "mute_status",
                    username: myUsername,
                    isMuted: isMicMuted
                }));
            }
        });

        btnDeafen.addEventListener('click', () => {
            isDeafened = !isDeafened;
            if (isDeafened) {
                btnDeafen.textContent = "🔇 Audio: Deafened";
                btnDeafen.className = "ctrl-btn btn-status-off";
            } else {
                btnDeafen.textContent = "🔊 Audio: On";
                btnDeafen.className = "ctrl-btn btn-blue";
            }
        });

        // 7. Video & Screen Share Engine
        btnCamera.addEventListener('click', async () => {
            if (isCameraOn) {
                stopMediaStream();
                isCameraOn = false;
                btnCamera.textContent = "📹 Camera: Off";
                btnCamera.className = "ctrl-btn btn-secondary";

                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ type: "stop_video", username: myUsername }));
                }
                createOrUpdateTile(myUsername, null, "avatar", true);
            } else {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 480, height: 360 } });
                    captureVideo.srcObject = stream;
                    await captureVideo.play();

                    startVideoBroadcasting('camera');
                    isCameraOn = true;
                    btnCamera.textContent = "📹 Camera: On";
                    btnCamera.className = "ctrl-btn btn-status-on";

                    if (isScreenOn) {
                        isScreenOn = false;
                        btnScreen.textContent = "🖥️ Screen: Off";
                        btnScreen.className = "ctrl-btn btn-secondary";
                    }
                } catch (err) {
                    // Fallback to animated interactive video avatar
                    startAvatarBroadcasting();
                    isCameraOn = true;
                    btnCamera.textContent = "📹 Camera: On (Avatar)";
                    btnCamera.className = "ctrl-btn btn-status-on";
                }
            }
        });

        btnScreen.addEventListener('click', async () => {
            if (isScreenOn) {
                stopMediaStream();
                isScreenOn = false;
                btnScreen.textContent = "🖥️ Screen: Off";
                btnScreen.className = "ctrl-btn btn-secondary";

                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ type: "stop_video", username: myUsername }));
                }
                createOrUpdateTile(myUsername, null, "avatar", true);
            } else {
                try {
                    const stream = await navigator.mediaDevices.getDisplayMedia({ video: { width: 640, height: 360 } });
                    captureVideo.srcObject = stream;
                    await captureVideo.play();

                    startVideoBroadcasting('screen');
                    isScreenOn = true;
                    btnScreen.textContent = "🖥️ Screen: Sharing";
                    btnScreen.className = "ctrl-btn btn-purple";

                    if (isCameraOn) {
                        isCameraOn = false;
                        btnCamera.textContent = "📹 Camera: Off";
                        btnCamera.className = "ctrl-btn btn-secondary";
                    }

                    stream.getVideoTracks()[0].onended = () => {
                        if (isScreenOn) btnScreen.click();
                    };
                } catch (err) {
                    console.log("Screen share cancelled or not allowed.");
                }
            }
        });

        function startVideoBroadcasting(mode) {
            clearInterval(videoBroadcastInterval);
            videoBroadcastInterval = setInterval(() => {
                if (captureVideo.readyState === captureVideo.HAVE_ENOUGH_DATA) {
                    ctx.drawImage(captureVideo, 0, 0, captureCanvas.width, captureCanvas.height);
                    const jpeg = captureCanvas.toDataURL('image/jpeg', 0.6);
                    createOrUpdateTile(myUsername, jpeg, mode, true);

                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({
                            type: "video_frame",
                            username: myUsername,
                            mode: mode,
                            image: jpeg
                        }));
                    }
                }
            }, 100); // 10 FPS
        }

        function startAvatarBroadcasting() {
            clearInterval(videoBroadcastInterval);
            videoBroadcastInterval = setInterval(() => {
                avatarAngle += 0.1;
                ctx.fillStyle = '#0f172a';
                ctx.fillRect(0, 0, captureCanvas.width, captureCanvas.height);

                const cx = captureCanvas.width / 2;
                const cy = captureCanvas.height / 2;
                const r = 58 + Math.sin(avatarAngle) * 5;

                ctx.beginPath();
                ctx.arc(cx, cy, r, 0, Math.PI * 2);
                ctx.fillStyle = '#3b82f6';
                ctx.fill();
                ctx.lineWidth = 4;
                ctx.strokeStyle = '#10b981';
                ctx.stroke();

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 32px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(myUsername.substring(0, 2).toUpperCase(), cx, cy);

                ctx.font = '15px sans-serif';
                ctx.fillText(myUsername, cx, captureCanvas.height - 28);

                const jpeg = captureCanvas.toDataURL('image/jpeg', 0.6);
                createOrUpdateTile(myUsername, jpeg, 'camera', true);

                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({
                        type: "video_frame",
                        username: myUsername,
                        mode: 'camera',
                        image: jpeg
                    }));
                }
            }, 100);
        }

        function stopMediaStream() {
            clearInterval(videoBroadcastInterval);
            if (captureVideo.srcObject) {
                captureVideo.srcObject.getTracks().forEach(t => t.stop());
                captureVideo.srcObject = null;
            }
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
